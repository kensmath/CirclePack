name: Build and package

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # A single Linux runner is enough here, unlike GOPack-cpp's own
    # windows/macos/linux build matrix: this repo doesn't compile any native
    # code itself. The three platform binaries the jar needs
    # (cdeps/win64/gopack_jni.dll, cdeps/macos/libgopack_jni.dylib,
    # cdeps/linux64/libgopack_jni.so) are fetched fresh from GOPack-cpp's
    # rolling "latest" GitHub Release on every CI run (see the "Fetch latest
    # GOPack-cpp native libraries" step below) before maven-assembly-plugin's
    # circlepack.xml descriptor sweeps cdeps/ into the jar. The copies
    # checked into the repo are only a fallback for offline/local `mvn
    # package` runs -- this job always overwrites them with whatever
    # GOPack-cpp's master branch currently builds, and does not commit the
    # refreshed files back.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17' # matches maven.compiler.source/target in pom.xml
          cache: maven

      # pom.xml's <dependencies> include several with groupId "local" --
      # real jars checked into jars/ (not published to Maven Central, or
      # anywhere else this runner can fetch from), that a developer's own
      # machine only has because someone once ran "mvn install:install-file"
      # there by hand. A fresh CI runner's local repo starts empty, so that
      # one-time step has to be repeated here on every run before "mvn
      # package" can resolve them. me.friwi:jcefmaven is the one real
      # (non-"local") dependency in the pom; it's left for Maven to fetch
      # from Central normally, below.
      - name: Install local dependency jars into the Maven repo
        run: |
          set -e
          mvn -B install:install-file -Dfile=jars/commons-codec-1.5.jar \
              -DgroupId=local -DartifactId=commons-codec -Dversion=1.5 -Dpackaging=jar
          mvn -B install:install-file -Dfile=jars/Complex.jar \
              -DgroupId=local -DartifactId=Complex -Dversion=1.0 -Dpackaging=jar
          mvn -B install:install-file -Dfile=jars/Convert2.0.jar \
              -DgroupId=local -DartifactId=Convert -Dversion=2.0 -Dpackaging=jar
          mvn -B install:install-file -Dfile=jars/DJEP2.4.0Minimal.jar \
              -DgroupId=local -DartifactId=DJEP -Dversion=2.4.0 -Dpackaging=jar
          mvn -B install:install-file -Dfile=jars/FunctionChoiceBox.jar \
              -DgroupId=local -DartifactId=FunctionChoiceBox -Dversion=1.0 -Dpackaging=jar
          mvn -B install:install-file -Dfile=jars/FunctionField.jar \
              -DgroupId=local -DartifactId=FunctionField -Dversion=1.0 -Dpackaging=jar
          mvn -B install:install-file -Dfile=jars/FunctionParser.jar \
              -DgroupId=local -DartifactId=FunctionParser -Dversion=1.0 -Dpackaging=jar
          mvn -B install:install-file -Dfile=jars/xercesImpl.jar \
              -DgroupId=local -DartifactId=xercesImpl -Dversion=1.0 -Dpackaging=jar

      # Pulls the current GOPack-cpp binaries down from that repo's rolling
      # "latest" GitHub Release and drops them into cdeps/, overwriting
      # whatever is checked in, so this jar always packages GOPack-cpp's
      # current master build. Both repos are public, so `gh` (preinstalled
      # on GitHub-hosted runners) can download the release assets
      # anonymously -- ${{ github.token }} is only supplied because `gh`
      # wants some authenticated context to run under; it does not need any
      # special permission on GOPack-cpp to read a public release. This
      # fetch is transient: nothing here is committed back to the repo, so a
      # local `mvn package` still falls back to whatever is checked into
      # cdeps/ until someone updates it by hand.
      - name: Fetch latest GOPack-cpp native libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          rm -rf /tmp/gopack-cpp-assets
          mkdir -p /tmp/gopack-cpp-assets
          gh release download latest \
            --repo kensmath/GOPack-cpp \
            --dir /tmp/gopack-cpp-assets \
            --pattern '*.zip' \
            --clobber

          mkdir -p cdeps/win64 cdeps/macos cdeps/linux64
          unzip -oq /tmp/gopack-cpp-assets/gopack-cpp-windows-x64.zip -d /tmp/gopack-cpp-assets/windows-x64
          unzip -oq /tmp/gopack-cpp-assets/gopack-cpp-macos-universal.zip -d /tmp/gopack-cpp-assets/macos-universal
          unzip -oq /tmp/gopack-cpp-assets/gopack-cpp-linux-x64.zip -d /tmp/gopack-cpp-assets/linux-x64

          cp /tmp/gopack-cpp-assets/windows-x64/gopack_jni.dll cdeps/win64/gopack_jni.dll
          cp /tmp/gopack-cpp-assets/macos-universal/libgopack_jni.dylib cdeps/macos/libgopack_jni.dylib
          cp /tmp/gopack-cpp-assets/linux-x64/libgopack_jni.so cdeps/linux64/libgopack_jni.so

          echo "Fetched GOPack-cpp binaries (latest release):"
          ls -la cdeps/win64 cdeps/macos cdeps/linux64

      # Runs the full "package" phase: compiles src/main/java, runs the
      # exec-maven-plugin Info2HTML generation step, then builds all three
      # maven-assembly-plugin jars (CirclePack-<version>.jar, ScriptLister.jar,
      # Info2HTML.jar) into target/. Each already bundles its own
      # dependencies and (for CirclePack-<version>.jar) the native libs from
      # cdeps/, so nothing further is needed to make them runnable.
      - name: Package with Maven
        run: mvn -B package

      - name: List built jars
        run: ls -la target/*.jar

      - name: Upload built jars
        uses: actions/upload-artifact@v4
        with:
          name: circlepack-jars
          path: |
            target/CirclePack-*.jar
            target/ScriptLister.jar
            target/Info2HTML.jar
          if-no-files-found: error
